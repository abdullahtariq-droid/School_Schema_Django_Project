<!DOCTYPE html>
<html>

<head>
    <title>Quiz Options</title>
</head>

<body>
    <h1>All Quiz Options</h1>

    <!-- Display all quiz options -->
    <ul>
        {% for option in options %}
        <li>
            {{ option.id }} - Question: {{ option.question }}
            → Option: {{ option.option_text }}
            {% if option.is_correct %}
            <strong>(Correct)</strong>
            {% endif %}
        </li>
        {% empty %}
        <li>No options available.</li>
        {% endfor %}
    </ul>

    <hr>

    <h2>Add New Option</h2>
    <!-- Form to add a new quiz option -->
    <form method="post">
        {% csrf_token %}

        <label for="question">Select Question:</label>
        <select name="question" required>
            {% for question in questions %}
            <option value="{{ question.id }}">{{ question.question_text }}</option>
            {% endfor %}
        </select><br><br>

        <label for="option_text">Option Text:</label><br>
        <input type="text" name="option_text" required><br><br>

        <label for="is_correct">Is Correct?</label>
        <input type="checkbox" name="is_correct"><br><br>

        <button type="submit">Add Option</button>
    </form>
</body>

</html>
