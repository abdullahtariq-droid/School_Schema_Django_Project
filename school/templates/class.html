{% extends "base.html" %}

{% block title %}Classes{% endblock %}

{% block content %}
<div class="container my-4">
    <h1 class="mb-4">All Classes</h1>

    <!-- Display all classes in a Bootstrap table -->
    <div class="table-responsive">
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Class ID</th>
                    <th>Class Name</th>
                    <th>Teacher</th>
                </tr>
            </thead>
            <tbody>
                {% for c in classes %}
                <tr>
                    <td>{{ c.class_id }}</td>
                    <td>{{ c.class_name }}</td>
                    <td>{{ c.teacher }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="text-center">No classes found.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
